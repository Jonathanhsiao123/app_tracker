# One file per user. EVERYTHING SUBJECTIVE LIVES HERE (addendum 3).
#
# Nothing in this file touches a posting record. Analysis - eligibility label, evidence
# sentence, keyword matches, degree flag, YoE floor, role class, function, locations - is
# objective, computed once, and shared by every profile. That separation is why adding a
# second user costs zero extra fetching, and why editing this file never triggers a
# re-crawl: priorities apply at ALERT time, not at analysis time.
#
# Every field has a default in code, so a minimal profile is four lines. Delete anything
# here you do not care about. A field name that is NOT recognised is an error, not a
# warning - a typo'd `on_unkown` would otherwise leave the flood in place with no error
# anywhere (T8.12).
#
# `jobmon run --profile jonathan`; no flag runs every profile in this directory.

name: jonathan
locale: us

# --- work authorization -------------------------------------------------
eligibility:
  needs_sponsorship: true          # false for a citizen/PR user: whole block no-ops
  on_blocked: suppress             # suppress | digest | alert
  on_unknown: digest               # the majority case. digest, not alert
  on_likely_ok: alert              # explicit sponsorship language is a strong signal
  min_sponsor_confidence: occasional   # frequent | occasional | none_observed | any
  suppress_clearance: true         # clearance and ITAR are hard blocks, separate toggle
  # `min_sponsor_confidence` DOWNRANKS by default and never suppresses. Set this to
  # `suppress` or `digest` only if you mean it: LCA filing history is a prior, not a fact
  # about this req, and a small employer who would sponsor simply has not filed yet.
  on_below_min_sponsor: downrank

# --- what counts as relevant -------------------------------------------
roles:
  role_class: [new_grad, internship]
  on_unclear_role: digest          # was: alert. This alone is a large cut
  priorities:                      # see Phase X. Reorder these lines to re-rank.
    # The last three are the non-software roles that used to sit under "unclassified".
    # Listed so they are labeled and sorted to the bottom; move any of them to `never`
    # to stop receiving that kind of role at all.
    order: [mle, security, systems, swe, data, hardware, product, business]
    never: [quant, sdet]
    sort_by: priority              # priority | score | date | company
  degree_gated: digest             # MS/PhD required
  max_yoe: 2

# --- LLM clearance screen ---------------------------------------------------------
# A model on Luminal Cloud (paid from the account's token credit) reads the WHOLE posting -
# or the apply page, for curated-list rows that come without one - before it is sent, and
# drops anything requiring a security clearance or US citizenship / US-person status,
# including when that requirement sits in the last paragraph.
#
# Needs two repository secrets, LUMINAL_API_KEY and LUMINAL_BASE_URL (the endpoint up to,
# not including, /chat/completions), and `model` below set to your deployment's model name.
#
# THE TOGGLE: `enabled`. Set false to go back to the regex filter alone. To switch it off
# for one run without a commit, set the repository variable JOBMON_LLM_SCREEN=off.
#
# Fails open: anything unset, an outage or a spent budget sends postings unscreened (regex
# rules still apply) and says so in the digest footer. Verdicts are cached in
# state/screened.jsonl, so each posting costs one call, once.
screening:
  enabled: true
  model: ""                        # FILL IN: the model name of your Luminal deployment
  on_unclear: keep                 # keep | suppress. `unclear` = model had only a title
  fetch_pages: true
  max_calls_per_run: 300

locations:
  allow: [remote, "United States"]
  prefer: ["Pittsburgh", "New York", "Seattle", "Bay Area"]
  deny: []

# --- noise control ------------------------------------------------------
#
# CALIBRATED FROM A MEASURED SWEEP, NOT FROM INTUITION (addendum 1). Numbers below are from
# a real 17,292-posting sweep on 2026-09-17, scored against this profile:
#
#   321  postings first seen in the last 24h  (the pool one day of alerts is drawn from)
#   154  of those the policy layer lets reach digest-or-louder
#        (the other 167 are role_class `experienced`, `quant`, clearance/ITAR, or blocked)
#
#   min_score | qualifying items per 24h
#      0.55   |    13
#      0.45   |    20
#      0.40   |    33
#      0.35   |    38
#      0.30   |    43   <-- set here
#      0.25   |    89
#
# WHAT 0.55 ACTUALLY DID. It admitted **0 of 321**. The previous note in this file guessed
# that "0.55 passed 4 of 410 candidates"; measured, it passed none, and the four digest
# items that did arrive were tier-1 companies riding the tier bypass at scores of 0.18 to
# 0.43 - i.e. the threshold was not selecting good postings, it was selecting nothing, and
# the mail was made entirely of the exception to it.
#
# Two compounding causes, both now fixed in code:
#   1. `sponsor_history.yaml` is empty, so every employer scores `unknown`, which cost each
#      posting half the eligibility term (0.075 of 0.15).
#   2. `min_sponsor_confidence: occasional` then charged a FLAT 0.10 on top - to 321 of 321
#      candidates. `scoring.score` now exempts `unknown` from that penalty: no data is not
#      evidence of refusal, and a penalty that fires on 100% of rows ranks nothing.
# Together those docked 0.175 of a 1.0 scale from every posting, so 0.55 behaved like
# 0.725 - above the observed maximum score of any posting in the sweep.
#
# THE CAPS, NOT THE THRESHOLD, ARE THE GUARANTEE (addendum 5). 0.30 is deliberately loose:
# `max_digest_items` and `max_per_company_per_day` bound what actually arrives, and they
# bound it by taking the HIGHEST-SCORING items first. A loose threshold with tight caps
# gives you the best 25; a tight threshold gives you an empty inbox and no ranking at all.
# Re-measure with `jobmon audit --days 7` before moving this.
limits:
  min_score: 0.30                  # below this: stored, not alerted. MEASURED - see above
  max_instant_per_day: 8
  max_digest_items: 25
  max_per_company_per_day: 3       # stops one employer flooding a digest
  suppress_if_applied: true
  suppress_reposts: true

  # --- the still-open recap ---------------------------------------------------------
  # An hourly sweep finds ~40 qualifying postings per DAY, so roughly one or two per run.
  # A digest holding only those is technically correct and not worth opening, and on a
  # quiet hour it is the sentence "no new eligible openings were found".
  #
  # So the digest carries a second section: the best still-open postings from the last
  # `recap_days`, one compact line each, grouped by `priorities.order`. Measured on the
  # same sweep, 1,029 postings were first seen in the last 3 days AND still live, of which
  # 133 clear `min_score` and the policy layer - so this section is always full.
  #
  # Recap items are NEVER marked alerted. They recur every run until the employer takes
  # the posting down or you `jobmon apply`, which is what makes it a standing list rather
  # than a second chance to miss something.
  recap_days: 3                    # today plus the two days before it
  max_recap_items: 25

denylist:
  companies: []
  title_terms: [salesforce, sap, workday consultant, sdet]
  # `postings:` is appended to by `jobmon mute`, via state/feedback/jonathan.jsonl.
  # You can also list global_ids here by hand.

# ntfy | email | all | none.
#
# `instant: all`, NOT `ntfy`. Instants are the highest-scoring postings the system finds,
# and routing them to the phone ONLY meant they never appeared in the mail at all - so the
# email channel carried the digest, the digest was empty (see `limits` above), and the mail
# was empty while the good postings went somewhere else. If the two channels ever disagree
# about a posting, the quiet one wins by accident. Send instants to both and let the digest
# be the thing that is merely thorough.
routing:
  instant: all                     # tier-1 companies and score >= 0.8: phone AND mail
  digest: email                    # every sweep, ~hourly
  silent: none                     # stored only, visible via `jobmon list --all`
