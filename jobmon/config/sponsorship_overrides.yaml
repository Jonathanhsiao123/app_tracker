# Company-level eligibility overrides (spec 6). Hand-maintained. OVERRIDES BEAT TEXT.
#
# status: blocked | likely_ok      (only these two - "unknown" means: no entry here)
# note:   free text, why
# checked_on: YYYY-MM-DD           required; a stale check should be visible in the alert
#
# KEY IS THE COMPANY DISPLAY NAME (companies.yaml `company:`), NOT the ATS slug.
# `filters/eligibility.apply_override` matches on a normalized, token-prefix comparison
# against `Posting.company`, e.g. key "scale ai" matches company "Scale AI Inc" - it does
# NOT look anything up by slug. A slug-shaped key like "scaleai" or "linkedin3" normalizes
# to a token that never prefix-matches the real company name and silently never fires.
#
# Seeding, once, one evening, for the top ~60 targets (spec 6):
#   - public H-1B and PERM disclosure data (DOL LCA filings, and the aggregator sites
#     built on them) -> likely_ok
#   - known defense and government-contractor employers -> blocked
# More reliable than any text heuristic, which is why it wins over one.
#
# TODO: populate. Format below.

# anduril:
