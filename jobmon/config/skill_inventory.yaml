# What I actually have, by the same categories as taxonomy.yaml (spec 8).
# gap_list() = taxonomy terms in a posting MINUS these.
#
# Be honest here. An inflated inventory produces an empty gap list, which makes the most
# useful output of the whole system useless. An EMPTY one produces a maximal gap list,
# which is equally useless.
#
# Extracted 2026-09-06 from resumes/Jonathan_Hsiao_Resume_Sept2026(1).pdf.
# LITERAL MATCHES ONLY - a taxonomy term is listed here only if that term appears in the
# source document. Nothing is added by inference (build step T2.7). Terms deliberately
# withheld, and why, are listed at the bottom; hand-add any you disagree with.
#
# Shape is a flat category -> term list, per the decision to defer {depth, evidence} to
# its own step. Consequence: gap_list cannot use depth to judge real vs cosmetic, so it
# uses the `equivalents` map below instead.

languages: [python, c, java, verilog]        # "Languages: Python, C, R, Java, JavaScript, Verilog"
ml_frameworks: [pytorch, tensorflow]         # "ML / AI: PyTorch, TensorFlow"
ml_topics: [reinforcement learning, adversarial, robustness, llm]
infra: []                                    # no Kubernetes, Docker, AWS or GCP anywhere
systems: [pyqt, drivers]                     # "PyQt6"; "Developed Python drivers"
security: [intrusion detection, iot]         # "IoT Intrusion Detection"; "IoT devices"

# Near-substitutes: a posting term whose gap is COSMETIC because of something I do have.
# "They said TensorFlow, I have PyTorch" is the canonical case (spec 8).
#
# A gap counts as cosmetic ONLY if the substitute named here is itself in the inventory
# above. `gcp: aws` therefore still yields a REAL gap, because there is no aws either -
# which is correct, and is the kind of thing an equivalents map gets wrong if it is
# trusted blindly.
equivalents:
  tensorflow: pytorch
  jax: pytorch
  scikit-learn: pytorch
  gcp: aws
  ids: intrusion detection

