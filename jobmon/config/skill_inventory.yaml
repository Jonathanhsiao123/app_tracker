#          guard, and "go engine" is a stop phrase so it stays excluded.
#   aws  - "$300,000 Amazon-funded" is funding, not Amazon Web Services.
#   nlp  - RAG and LLM work is present; the term "NLP" is not. Cosmetic via `nlp: llm`.
#   dsp  - lock-in amplifiers and signal averaging ARE DSP, but the resume never says
#          "signal processing". Cosmetic via `dsp: instrumentation`, not claimed outright.
