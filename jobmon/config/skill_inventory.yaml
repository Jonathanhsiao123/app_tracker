# What I actually have, by the same categories as taxonomy.yaml (spec 8).
# gap_list() = taxonomy terms in a posting MINUS these.
#
# Be honest here. An inflated inventory produces an empty gap list, which makes the most
# useful output of the whole system useless. An EMPTY one produces a maximal gap list,
# which is equally useless.
#
# DERIVED, not hand-written. Regenerate with:
#     python -c "from jobmon import config_loader as c; from jobmon.analyze import keywords
#                cfg=c.load(); print(keywords.match(open('resume.txt').read(),'',cfg.taxonomy))"
# Source: resumes/Jonathan_Hsiao_Resume_Sept2026(1).pdf, extracted 2026-09-06 through the
# same alias-aware matcher the postings go through. A term is here only if the resume
# contains it or one of its ALIASES - never by inference (build step T2.7).
#
# Shape is a flat category -> term list, per the decision to defer {depth, evidence} to its
# own step. Consequence: gap_list judges real vs cosmetic from `equivalents` below, not
# from depth.

languages: [c, java, python, verilog]
ml_frameworks: [pytorch, tensorflow]
ml_topics: [adversarial, computer vision, llm, reinforcement learning, robustness]
infra: []                       # no Kubernetes, Docker, AWS or GCP anywhere. Real gaps.
systems: [drivers, embedded, instrumentation, pyqt]
security: [intrusion detection, iot]

# How the three non-obvious entries above are evidenced, via ALIASES in keywords.py:
#   computer vision <- "YOLOv8"
#   embedded        <- "microcontrollers", "TinyML"
#   instrumentation <- "spectrometers", "spectroscopy", "lock-in amplifier"
# Each was previously withheld as inference and cost ~1,085 phantom "real gaps" across the
# corpus. Routing them through an explicit, auditable alias map makes them evidence.
# Delete an alias in keywords.py to withdraw one.

# Near-substitutes: a posting term whose gap is COSMETIC because of something I do have.
# "They said TensorFlow, I have PyTorch" is the canonical case (spec 8).
#
# A gap counts as cosmetic ONLY if the substitute named here is itself in the inventory
# above. `gcp: aws` therefore still yields a REAL gap, because there is no aws either -
# which is correct, and is the kind of thing an equivalents map gets wrong if trusted
# blindly. It is left in deliberately as the worked example of that.
equivalents:
  # ML frameworks: all PyTorch-adjacent, and PyTorch is the deepest thing here.
  tensorflow: pytorch
  jax: pytorch
  scikit-learn: pytorch
  huggingface: pytorch
  # Hardware/systems: Verilog is FPGA work; driver work is firmware-adjacent.
  fpga: verilog
  firmware: drivers
  rtos: embedded
  dsp: instrumentation
  # Topics
  nlp: llm
  ids: intrusion detection
  # JUDGEMENT CALL, and the highest-impact entry here: c++ was the single most common
  # "real" gap in the corpus (830 postings). C and C++ are genuinely different languages,
  # but for a new-grad req listing "C/C++" the transfer is real. Marked cosmetic so the
  # alert says "c++ (~c)" rather than implying no systems-language background at all.
  # Delete this line if you would rather see it as a hard gap.
  c++: c
  # Left as a REAL gap on purpose - no substitute is held, so the map must not pretend:
  gcp: aws

