# --- 5c: curated GitHub repos. Phase 3, and the PRIMARY big tech source. -----------
# Repo names roll over by year - that is exactly why these are config (spec 5c).
# Default branches verified 2026-09-06 (SimplifyJobs and vanshb03 use `dev`, speedyapply
# uses `main`). Both table formats are HTML <tr> rows or markdown pipe rows, not the
# "markdown tables" spec 5c assumes - scripts/bootstrap_companies.py handles both.
github_repos:
  # Cycle verified 2026-09-06. Every entry below is a 2027-cycle list.
  # REJECTED: SimplifyJobs/New-Grad-Positions - its README still reads "2026 New Grad
  # Positions ... for 2025 & 2026 new graduates". Not the 2027 cycle (build step 1 rule 1).
  # Re-check it when the cycle rolls; it is the largest new grad list by a wide margin.
  - url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md
    kind: internship
  - url: https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/README.md
    kind: new_grad
  - url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
    kind: both

# --- 5b: hand-reverse-engineered portals. Phase 3, only where repos cover poorly. ---
# See adapters/bigtech/__init__.py. Build one ONLY after confirming the curated repos
# miss that company - otherwise this duplicates free, faster, community-maintained work.
bigtech: []

# --- Explicitly not scraped (spec 5) ------------------------------------------------
# LinkedIn, Indeed, ZipRecruiter, Glassdoor. Aggressive bot detection, account-suspension
# risk on accounts that are actually needed, and they mostly repost what the ATS boards
# and curated repos already give from the source.
