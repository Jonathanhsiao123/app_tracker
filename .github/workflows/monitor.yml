# Scheduled run in a PRIVATE repo. Hourly batches keep email close to posting time.
#
# Persistence is the committed ledger under state/ (build step 6, addendum 2):
#
#   state/postings.jsonl           global:      one line per posting, no alert state
#   state/alerted/<profile>.jsonl  per profile: one line per delivered alert
#   state/feedback/<profile>.jsonl per profile: `jobmon mute` / `boost` records
#
# The SQLite file is a derived cache, rebuilt from those into a tmpdir every run and thrown
# away. A pre-addendum state/seen.jsonl in the checkout is migrated into the split files on
# the first run and then left alone; nothing here needs to change for that to happen.
#
# `actions/cache` was considered and REJECTED: entries evict silently after 7 days idle,
# and the failure mode is a mass re-alert - thousands of notifications for the quietest
# possible cause. A committed file is ugly and reliable, which is the trade this project
# makes everywhere else too.
#
# WHAT A RED RUN MEANS HERE. A failed Actions run emails you, and this project exists so
# that the things that reach your phone are job postings. So the run goes red for exactly
# two causes: the code crashed, or JOBMON_NTFY_TOPIC is missing and there is therefore no
# other way to tell you anything. Every other problem - a dead adapter, a board that went
# to zero - is pushed to the ntfy topic by `jobmon run` itself, which exits 3 to say
# "reported, already delivered, do not turn this red".
#
# PROOF OF LIFE IS THE DIGEST ITSELF. There used to be a separate "Heartbeat email" step
# here, added because `jobmon run` appeared to email only when it found something new, so a
# quiet hour looked identical to a broken pipeline. It has been REMOVED, because it was
# treating a symptom of two real bugs that are now fixed:
#
#   * the digest was empty on almost every run - `min_score: 0.55` admitted 0 of 321
#     candidates on a measured sweep (see the profile YAML), so the mail that did arrive
#     said "no new eligible openings were found" and the heartbeat was the only other mail;
#   * `routing.instant: ntfy` sent the few postings that did qualify to the phone ONLY,
#     so they never appeared in email at all.
#
# `jobmon run` now delivers a digest on EVERY sweep - new postings first, then the
# still-open recap from the last `recap_days` - so the digest is the proof of life, and it
# carries the run gap in its footer when the schedule has slipped. A second unconditional
# email per hour saying "a thing ran" is what this project is supposed to replace.
name: jobmon

on:
  schedule:
    # THREE ATTEMPTS PER HOUR, NOT THREE SWEEPS PER HOUR.
    #
    # GitHub delivers `schedule` on a best-effort basis and silently DROPS ticks when the
    # Actions queue is busy; a private repo on the free plan is exactly the case where that
    # happens most. Measured on this repo: a nominally hourly cron produced run ids 23
    # through 33 over 37 hours - ten sweeps where there should have been thirty-seven. The
    # ids were contiguous and every run was green, so nothing crashed and nothing ever went
    # red. The only symptom was mail that felt irregular.
    #
    # One cron entry gives that failure one chance to ruin the hour. Three spaced attempts
    # give it three, and `--min-interval 50m` below makes the second and third attempts
    # no-ops whenever the first one actually landed - so this costs a few seconds of runner
    # time per skipped attempt and never a second digest.
    #
    # Offsets avoid :00, which is the most contended minute of the hour.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending them"
        type: boolean
        default: false

# Keep only the newest run when a sweep overlaps the next tick. Queuing old sweeps can turn
# an hourly schedule into multi-hour delivery gaps; the ledger makes a canceled run
# retryable on the next pass. With three attempts an hour this also means a slow sweep is
# superseded rather than raced.
concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # Without a cap the hosted-runner ceiling is 6 hours, so a genuinely stuck sweep would
    # starve the monitor for most of a day before GitHub cut it off. 20 minutes is well
    # over 10x a real sweep - measured 2026-09-17, a full cold pass over the configured
    # boards fetched 17,292 postings in 39 seconds, and the still-open recap adds ~18
    # seconds of analysis - so a normal run never approaches it.
    timeout-minutes: 20
    permissions:
      contents: write # to commit the ledger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      # No "restore database" step: there is nothing to restore. The ledger is in the
      # checkout, and `--ledger` rebuilds the cache from it in a tmpdir.
      #
      # FIRST RUN SEEDS. With no ledger in the checkout, every currently-open posting is
      # new - over 13,000 on the configured board set (README). `--seed` records them as
      # already-alerted and sends nothing, so the first delivered alert is a posting that
      # genuinely appeared after jobmon started watching. This is keyed on the files, not
      # on a one-time flag, so a lost ledger costs one quiet cycle instead of a flood.
      #
      # A checkout holding only the pre-addendum state/seen.jsonl is NOT a lost ledger: it
      # is migrated in, so the seed branch deliberately checks for both spellings.
      - name: Run
        id: run
        env:
          JOBMON_NTFY_TOPIC: ${{ secrets.JOBMON_NTFY_TOPIC }}
          JOBMON_SMTP_HOST: ${{ secrets.JOBMON_SMTP_HOST }}
          JOBMON_SMTP_PORT: ${{ secrets.JOBMON_SMTP_PORT }}
          JOBMON_SMTP_USER: ${{ secrets.JOBMON_SMTP_USER }}
          JOBMON_SMTP_PASSWORD: ${{ secrets.JOBMON_SMTP_PASSWORD }}
          JOBMON_EMAIL_FROM: ${{ secrets.JOBMON_EMAIL_FROM }}
          JOBMON_EMAIL_TO: ${{ secrets.JOBMON_EMAIL_TO }}
          # The LLM clearance screen (profile `screening.enabled`). Unset = the screen is
          # skipped with a footer note, never a failed run. JOBMON_LLM_SCREEN is a
          # repository VARIABLE (not a secret): set it to `off` to disable without a commit.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOBMON_LLM_SCREEN: ${{ vars.JOBMON_LLM_SCREEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(run --ledger state/postings.jsonl)
          # Only for `schedule`. A human who clicks "Run workflow" means it, and should
          # never be told "skipping, a run happened 12 minutes ago".
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            args+=(--min-interval 50m)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          elif [ ! -f state/postings.jsonl ] && [ ! -f state/seen.jsonl ]; then
            # Neither the split ledger NOR a pre-addendum seen.jsonl to migrate from.
            echo "::notice::no ledger under state/ - seeding. This run records" \
                 "every open posting as already-alerted and sends nothing; the next run" \
                 "alerts on genuinely new postings only."
            args+=(--seed)
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          fi
          set +e
          jobmon "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # Exit 3 (jobmon.cli.EXIT_PIPELINE_REPORTED): the run completed and pushed the
          # problem to the ntfy topic. You have already been told, on the channel you
          # read. Failing the job here would only add an email that says less.
          if [ "${code}" -eq 3 ]; then
            echo "::warning::jobmon reported a pipeline problem and pushed it to ntfy;" \
                 "see the log above. Not failing the run - the alert was delivered."
            exit 0
          fi
          exit "${code}"

      # Ordering is the whole point: `jobmon run` notifies and writes the ledger BEFORE
      # this step exists. A commit that fails here costs one duplicate alert next run; a
      # commit that had happened before a failed notify would have lost that alert
      # permanently. Bias toward duplicates.
      #
      # `if: always()` so a run that exited non-zero still commits the ledger - the
      # postings were delivered, and re-alerting them would be worse than recording a run
      # that also reported a broken adapter.
      - name: Commit the ledger
        if: always() && !inputs.dry_run
        run: |
          # `git status --porcelain`, NOT `git diff --quiet`. state/ is untracked until the
          # very first commit lands, and `git diff` does not see untracked files - so the
          # old check reported "unchanged", skipped the commit, and the ledger could never
          # come into existence. Every run then started from an empty ledger and re-alerted
          # from scratch forever. `status --porcelain` reports untracked paths as `??`.
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name  "jobmon[bot]"
          git config user.email "jobmon[bot]@users.noreply.github.com"
          git add state/
          git commit -m "jobmon: ledger update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while this one was fetching boards. Rebase rather
          # than force: both runs' ledger lines are wanted.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            echo "rebase attempt ${attempt} failed"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Reached only for a crash or a missing topic - the two cases where there is no push
      # notification, so the red run and its email ARE the notification.
      - name: Report failure
        if: failure()
        run: |
          echo "::error::jobmon could not complete. Exit code" \
               "'${{ steps.run.outputs.code }}'. Exit 2 means JOBMON_NTFY_TOPIC is not" \
               "set as a repository secret; anything else is a crash - read the log above."
