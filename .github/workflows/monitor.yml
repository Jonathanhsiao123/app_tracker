# Scheduled run (spec 3). GitHub Actions cron in a PRIVATE repo. Every 3 hours - faster
# is not useful, recruiters do not read a queue in real time.
#
# Persistence is the committed ledger at state/seen.jsonl (build step 6). The SQLite file
# is a derived cache, rebuilt from the ledger into a tmpdir every run and thrown away.
#
# `actions/cache` was considered and REJECTED: entries evict silently after 7 days idle,
# and the failure mode is a mass re-alert - thousands of notifications for the quietest
# possible cause. A committed file is ugly and reliable, which is the trade this project
# makes everywhere else too.
#
# WHAT A RED RUN MEANS HERE. A failed Actions run emails you, and this project exists so
# that the things that reach your phone are job postings. So the run goes red for exactly
# two causes: the code crashed, or JOBMON_NTFY_TOPIC is missing and there is therefore no
# other way to tell you anything. Every other problem - a dead adapter, a board that went
# to zero - is pushed to the ntfy topic by `jobmon run` itself, which exits 3 to say
# "reported, already delivered, do not turn this red".
name: jobmon

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending them"
        type: boolean
        default: false

# Two overlapping runs would both rebuild from the same ledger and both alert the same
# postings. Serialize instead, and never cancel: a cancelled run that already notified but
# had not yet committed would re-alert next time (T6.8).
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the ledger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      # No "restore database" step: there is nothing to restore. The ledger is in the
      # checkout, and `--ledger` rebuilds the cache from it in a tmpdir.
      #
      # FIRST RUN SEEDS. With no ledger in the checkout, every currently-open posting is
      # new - over 13,000 on the configured board set (README). `--seed` records them as
      # already-alerted and sends nothing, so the first delivered alert is a posting that
      # genuinely appeared after jobmon started watching. This is keyed on the file, not
      # on a one-time flag, so a lost ledger costs one quiet cycle instead of a flood.
      - name: Run
        id: run
        env:
          JOBMON_NTFY_TOPIC: ${{ secrets.JOBMON_NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --ledger state/seen.jsonl)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          elif [ ! -f state/seen.jsonl ]; then
            echo "::notice::no ledger at state/seen.jsonl - seeding. This run records" \
                 "every open posting as already-alerted and sends nothing; the next run" \
                 "alerts on genuinely new postings only."
            args+=(--seed)
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          fi
          set +e
          jobmon "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # Exit 3 (jobmon.cli.EXIT_PIPELINE_REPORTED): the run completed and pushed the
          # problem to the ntfy topic. You have already been told, on the channel you
          # read. Failing the job here would only add an email that says less.
          if [ "${code}" -eq 3 ]; then
            echo "::warning::jobmon reported a pipeline problem and pushed it to ntfy;" \
                 "see the log above. Not failing the run - the alert was delivered."
            exit 0
          fi
          exit "${code}"

      # Ordering is the whole point: `jobmon run` notifies and writes the ledger BEFORE
      # this step exists. A commit that fails here costs one duplicate alert next run; a
      # commit that had happened before a failed notify would have lost that alert
      # permanently. Bias toward duplicates.
      #
      # `if: always()` so a run that exited non-zero still commits the ledger - the
      # postings were delivered, and re-alerting them would be worse than recording a run
      # that also reported a broken adapter.
      - name: Commit the ledger
        if: always() && !inputs.dry_run
        run: |
          # `git status --porcelain`, NOT `git diff --quiet`. state/ is untracked until the
          # very first commit lands, and `git diff` does not see untracked files - so the
          # old check reported "unchanged", skipped the commit, and the ledger could never
          # come into existence. Every run then started from an empty ledger and re-alerted
          # from scratch forever. `status --porcelain` reports untracked paths as `??`.
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name  "jobmon[bot]"
          git config user.email "jobmon[bot]@users.noreply.github.com"
          git add state/
          git commit -m "jobmon: ledger update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while this one was fetching boards. Rebase rather
          # than force: both runs' ledger lines are wanted.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            echo "rebase attempt ${attempt} failed"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Reached only for a crash or a missing topic - the two cases where there is no push
      # notification, so the red run and its email ARE the notification.
      - name: Report failure
        if: failure()
        run: |
          echo "::error::jobmon could not complete. Exit code" \
               "'${{ steps.run.outputs.code }}'. Exit 2 means JOBMON_NTFY_TOPIC is not" \
               "set as a repository secret; anything else is a crash - read the log above."
