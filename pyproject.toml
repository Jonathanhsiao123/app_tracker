[project]
name = "jobmon"
version = "0.1.0"
description = "Job posting monitor for the 2027 new grad / Summer 2027 internship cycle (US market)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",  # HTML -> text for description_text; lxml is fine too
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
jobmon = "jobmon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["jobmon*"]

[tool.setuptools.package-data]
jobmon = ["config/*.yaml"]
